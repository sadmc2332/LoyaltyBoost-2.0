name: Build LoyaltyBoost

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: JAR oluştur
        run: gradle build

      - name: JAR dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: LoyaltyBoost
          path: build/libs/*.jar
